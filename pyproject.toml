[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelsep"
version = "0.1.0"
description = "Novelty separation and Normal Region Exclusion"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Koki Shoda"}]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
audio = ["torch>=2.7", "torchaudio>=2.7", "soundfile>=0.12", "librosa>=0.10", "huggingface-hub>=0.30", "safetensors>=0.4"]
dev = ["pytest>=8", "pandas>=2", "matplotlib>=3.8", "soundfile>=0.12", "pyyaml>=6"]

[project.scripts]
novelsep = "novelsep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
